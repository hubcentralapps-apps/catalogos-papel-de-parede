name: Scrape Coelho Tramas images

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  scrape:
    if: startsWith(github.event.issue.title, '[scrape-coelho-tramas]')
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Download Tramas images
        shell: bash
        run: |
          cat > /tmp/scrape.py <<'PY'
          import io, re, csv
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          BASE='https://www.coelhopapeisdeparede.com.br'
          OUT=Path('coelho-tramas')
          OUT.mkdir(exist_ok=True)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'})

          def get(url):
              r=S.get(url,timeout=45,allow_redirects=True)
              r.raise_for_status()
              return r

          rows=[]
          ok=0
          for num in range(4001, 4063):
              code=f'TR-{num}'
              candidates=[
                  f'{BASE}/produtos/papel-de-parede-tramas-tr-{num}/',
                  f'{BASE}/produtos/papel-de-parede-tramas-tr-{num}',
              ]
              page=None; purl=None
              for u in candidates:
                  try:
                      r=get(u)
                      if r.status_code==200 and code.lower() in r.text.lower():
                          page=r.text; purl=r.url; break
                  except Exception:
                      pass
              if not page:
                  rows.append([code,'','','PAGE_NOT_FOUND'])
                  print(code,'PAGE_NOT_FOUND')
                  continue
              soup=BeautifulSoup(page,'html.parser')
              urls=[]
              for tag in soup.find_all(['img','source']):
                  for attr in ('src','data-src','srcset','data-srcset'):
                      v=tag.get(attr)
                      if not v: continue
                      for part in str(v).split(','):
                          u=part.strip().split(' ')[0]
                          if u.startswith('//'): u='https:'+u
                          if u.startswith('/'):
                              u=urljoin(BASE,u)
                          if u.startswith('http'):
                              urls.append(u)
              # regex fallback
              urls += re.findall(r'https?://[^\"\'\s<>]+', page)
              # Keep image-like urls, prefer tienda nube cdn / products
              clean=[]
              for u in urls:
                  u=u.replace('&amp;','&').split('?')[0].rstrip(')\\\'\"')
                  low=u.lower()
                  if not any(ext in low for ext in ('.jpg','.jpeg','.png','.webp')) and '/products/' not in low:
                      continue
                  if u not in clean: clean.append(u)
              preferred=[u for u in clean if '/products/' in u.lower()]
              if preferred: clean=preferred
              # Prefer URLs that mention code or number
              specific=[u for u in clean if str(num) in u or code.lower() in u.lower()]
              if specific: clean=specific

              best=None
              for u in clean:
                  try:
                      rr=get(u)
                      im=Image.open(io.BytesIO(rr.content))
                      w,h=im.size
                      area=w*h
                      if best is None or area>best[0]:
                          best=(area,u,rr.content,im.format,w,h)
                  except Exception:
                      continue
              if not best:
                  rows.append([code,purl,'','NO_IMAGE'])
                  print(code,'NO_IMAGE')
                  continue
              _,u,blob,fmt,w,h=best
              ext={'JPEG':'.jpg','PNG':'.png','WEBP':'.webp'}.get(fmt,'.jpg')
              fname=f'{code}{ext}'
              (OUT/fname).write_bytes(blob)
              rows.append([code,purl,u,f'{w}x{h}'])
              ok+=1
              print(code,w,h,u)

          with open(OUT/'manifest.csv','w',newline='',encoding='utf-8-sig') as f:
              wr=csv.writer(f); wr.writerow(['codigo','produto_url','imagem_url','dimensoes']); wr.writerows(rows)
          (OUT/'RESUMO.txt').write_text(f'baixadas={ok} tentadas=62\n',encoding='utf-8')
          print('DONE',ok)
          PY
          python /tmp/scrape.py
      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: coelho-tramas-images
          path: coelho-tramas/
          if-no-files-found: error
          retention-days: 2
