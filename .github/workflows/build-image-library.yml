name: Build image library

on:
  push:
    branches: [main]
    paths:
      - 'dados/colecoes/**'
      - 'scripts/build_library.py'
      - 'scripts/build_library_v2.py'
      - 'scripts/build_wiler.py'
      - 'staging/**'
      - '.github/workflows/build-image-library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests beautifulsoup4
      - name: Expand staged PDF collections
        run: |
          if compgen -G "staging/*.zip" > /dev/null; then
            for archive in staging/*.zip; do
              echo "Expanding $archive"
              unzip -o "$archive" -d .
              rm "$archive"
            done
          fi
      - run: python scripts/build_library_v2.py
      - run: python scripts/build_wiler.py
      - name: Commit generated library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A imagens dados staging
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build image library for reviewed collections"
            git push
          fi

# Trigger rebuild after loading reviewed collections.
