name: Scrape Coelho Tramas images

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  scrape:
    if: startsWith(github.event.issue.title, '[scrape-coelho-tramas]')
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Download Tramas images
        shell: bash
        run: |
          cat > /tmp/scrape.py <<'PY'
          import io, re, csv
          from pathlib import Path
          from urllib.parse import urljoin
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          BASE='https://www.coelhopapeisdeparede.com.br'
          OUT=Path('coelho-tramas')
          OUT.mkdir(exist_ok=True)
          HEAD={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'}

          def get(url):
              r=requests.get(url,headers=HEAD,timeout=20,allow_redirects=True)
              r.raise_for_status()
              return r

          def one(num):
              code=f'TR-{num}'
              purl=f'{BASE}/produtos/papel-de-parede-tramas-tr-{num}/'
              try:
                  r=get(purl)
                  page=r.text
                  if code.lower() not in page.lower():
                      return [code,purl,'','PAGE_NOT_FOUND']
              except Exception as e:
                  return [code,purl,'',f'PAGE_FAIL:{e}']
              soup=BeautifulSoup(page,'html.parser')
              urls=[]
              for tag in soup.find_all(['img','source']):
                  for attr in ('src','data-src','srcset','data-srcset'):
                      v=tag.get(attr)
                      if not v: continue
                      for part in str(v).split(','):
                          u=part.strip().split(' ')[0]
                          if u.startswith('//'): u='https:'+u
                          if u.startswith('/'): u=urljoin(BASE,u)
                          if u.startswith('http'): urls.append(u)
              clean=[]
              for u in urls:
                  u=u.replace('&amp;','&').split('?')[0].rstrip(')\\\'\"')
                  low=u.lower()
                  if '/products/' not in low: continue
                  if u not in clean: clean.append(u)
              specific=[u for u in clean if str(num) in u or code.lower() in u.lower()]
              if specific: clean=specific
              # Often the first product-media URL is already the largest; still compare dimensions among up to 8 URLs.
              best=None
              for u in clean[:8]:
                  try:
                      rr=get(u)
                      im=Image.open(io.BytesIO(rr.content))
                      w,h=im.size; area=w*h
                      if best is None or area>best[0]: best=(area,u,rr.content,im.format,w,h)
                  except Exception:
                      continue
              if not best:
                  return [code,purl,'','NO_IMAGE']
              _,u,blob,fmt,w,h=best
              ext={'JPEG':'.jpg','PNG':'.png','WEBP':'.webp'}.get(fmt,'.jpg')
              (OUT/f'{code}{ext}').write_bytes(blob)
              return [code,purl,u,f'{w}x{h}']

          rows=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs={ex.submit(one,n):n for n in range(4001,4063)}
              for fut in as_completed(futs):
                  row=fut.result(); rows.append(row); print(*row)
          rows.sort(key=lambda r:r[0])
          ok=sum(1 for r in rows if r[3] and not r[3].startswith(('PAGE_','NO_')))
          with open(OUT/'manifest.csv','w',newline='',encoding='utf-8-sig') as f:
              wr=csv.writer(f); wr.writerow(['codigo','produto_url','imagem_url','dimensoes']); wr.writerows(rows)
          (OUT/'RESUMO.txt').write_text(f'baixadas={ok} tentadas=62\n',encoding='utf-8')
          print('DONE',ok)
          PY
          python /tmp/scrape.py
      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: coelho-tramas-images
          path: coelho-tramas/
          if-no-files-found: error
          retention-days: 2
