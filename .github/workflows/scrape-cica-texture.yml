name: Scrape Cica Texture II images

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  scrape:
    if: startsWith(github.event.issue.title, '[scrape-cica-texture]')
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Download Texture II images
        shell: bash
        run: |
          cat > /tmp/scrape.py <<'PY'
          import csv, io, re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          BASE='https://www.cicabragapapeldeparede.com.br'
          OUT=Path('cica-texture-ii')
          OUT.mkdir(exist_ok=True)
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'})

          def get(url):
              r=S.get(url,timeout=25,allow_redirects=True)
              r.raise_for_status()
              return r

          product_urls=set()
          # Enumerate product URLs from sitemap(s)
          queue=[BASE+'/sitemap.xml', BASE+'/sitemap_index.xml']
          seen=set()
          while queue and len(seen)<30:
              su=queue.pop(0)
              if su in seen: continue
              seen.add(su)
              try: txt=get(su).text
              except Exception: continue
              locs=[x.strip().replace('&amp;','&') for x in re.findall(r'<loc>(.*?)</loc>',txt,re.I|re.S)]
              for u in locs:
                  if u.endswith('.xml') and u not in seen: queue.append(u)
                  elif '/produtos/' in u and 'texture-ii' in u.lower(): product_urls.add(u.split('?')[0])

          # Fallback: current collection page products
          try:
              html=get(BASE+'/papel-de-parede1/papel-de-parede-texture-ii/?mpage=5').text
              for m in re.findall(r'href=[\"\']([^\"\']*/produtos/[^\"\']+)[\"\']', html, re.I):
                  u=m if m.startswith('http') else BASE+m
                  if 'texture-ii' in u.lower(): product_urls.add(u.split('?')[0])
          except Exception: pass

          rows=[]
          found_codes=set()
          for purl in sorted(product_urls):
              try: html=get(purl).text
              except Exception as e: continue
              text=BeautifulSoup(html,'html.parser').get_text(' ',strip=True)
              m=re.search(r'\bTX[- ]?(20\d{2})\b',text,re.I) or re.search(r'\bTX[- ]?(20\d{2})\b',html,re.I)
              if not m: continue
              code='TX-'+m.group(1)
              num=m.group(1)
              if code in found_codes: continue
              urls=[]
              soup=BeautifulSoup(html,'html.parser')
              for tag in soup.find_all(['img','source']):
                  for attr in ('src','data-src','data-srcset','srcset'):
                      v=tag.get(attr)
                      if not v: continue
                      for part in str(v).split(','):
                          u=part.strip().split(' ')[0]
                          if u.startswith('//'): u='https:'+u
                          if u.startswith('http') and 'mitiendanube.com' in u and '/products/' in u:
                              u=u.split('?')[0]
                              if u not in urls: urls.append(u)
              urls += [u for u in re.findall(r'https?://[^\"\'\s<>]+mitiendanube\.com[^\"\'\s<>]+',html,re.I) if '/products/' in u]
              clean=[]
              for u in urls:
                  u=u.replace('&amp;','&').split('?')[0].rstrip(')\\\'\"')
                  if u not in clean: clean.append(u)
              own=[u for u in clean if f'/{num}_' in u or f'/{num}-' in u]
              if own: clean=own
              # Prefer the straight-on catalog swatch _01; then any 640 image; then first.
              choices=[u for u in clean if re.search(fr'/{num}_01-',u,re.I)] or [u for u in clean if '-640-0.' in u] or clean
              if not choices: continue
              u=choices[0]
              try:
                  rr=get(u)
                  ctype=rr.headers.get('content-type','')
                  ext='.webp'
                  if 'jpeg' in ctype or 'jpg' in ctype: ext='.jpg'
                  elif 'png' in ctype: ext='.png'
                  try:
                      im=Image.open(io.BytesIO(rr.content)); dims=f'{im.width}x{im.height}'
                  except Exception: dims=''
                  fname=f'{code}{ext}'
                  (OUT/fname).write_bytes(rr.content)
                  rows.append([code,purl,u,fname,dims])
                  found_codes.add(code)
                  print('READY',code,dims,u)
              except Exception as e:
                  print('FAIL',code,e)

          with open(OUT/'manifest.csv','w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['codigo','produto_url','imagem_url','arquivo','dimensoes']); w.writerows(rows)
          codes=sorted(found_codes)
          summary=f'products_discovered={len(product_urls)} codes_downloaded={len(codes)}\n'+'\n'.join(codes)+'\n'
          (OUT/'RESUMO.txt').write_text(summary,encoding='utf-8')
          print(summary)
          if len(codes)<40: raise SystemExit(f'Only {len(codes)} codes downloaded')
          PY
          python /tmp/scrape.py
      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: cica-texture-ii-images
          path: cica-texture-ii/
          if-no-files-found: error
          retention-days: 2
