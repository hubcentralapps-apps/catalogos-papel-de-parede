name: Build image library

on:
  push:
    branches: [main]
    paths:
      - 'dados/colecoes/**'
      - 'scripts/build_library.py'
      - '.github/workflows/build-image-library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - run: python scripts/build_library.py
      - name: Commit generated library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens dados/biblioteca-imagens.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build image library for reviewed collections"
            git push
          fi
