name: Build image library

on:
  push:
    branches: [main]
    paths:
      - 'dados/colecoes/**'
      - 'scripts/build_library.py'
      - 'scripts/build_library_v2.py'
      - 'scripts/build_wiler.py'
      - 'scripts/patch_home_finish.py'
      - 'staging/**'
      - '.github/workflows/build-image-library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export_kantai:
    if: contains(github.event.head_commit.message, '[KANTAI EXPORT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Kantai originals
        uses: actions/upload-artifact@v4
        with:
          name: kantai-originals
          path: imagens/kantai/**/originals/*.jpg
          if-no-files-found: error
          retention-days: 1

  build:
    if: ${{ !contains(github.event.head_commit.message, '[KANTAI EXPORT]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests beautifulsoup4

      # patch-run-v2: usa URLs diretas e preserva todo o restante da biblioteca
      - name: Patch only Home Finish problem images
        if: contains(github.event.head_commit.message, '[HF PATCH]')
        run: python scripts/patch_home_finish.py

      - name: Commit Home Finish patch
        if: contains(github.event.head_commit.message, '[HF PATCH]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d imagens/home-finish ]; then git add -A imagens/home-finish; fi
          git add -A dados/biblioteca-imagens.json
          if git diff --cached --quiet; then
            echo "No Home Finish patch changes"
          else
            git commit -m "Patch Home Finish problem images"
            git push
          fi

      - name: Expand staged PDF collections
        if: ${{ !contains(github.event.head_commit.message, '[HF PATCH]') }}
        run: |
          if compgen -G "staging/*.zip" > /dev/null; then
            for archive in staging/*.zip; do
              echo "Expanding $archive"
              unzip -o "$archive" -d .
              rm "$archive"
            done
          fi

      - name: Build Home Finish and Kantai library
        if: ${{ !contains(github.event.head_commit.message, '[HF PATCH]') }}
        run: python scripts/build_library_v2.py

      - name: Commit Home Finish and Kantai library
        if: ${{ !contains(github.event.head_commit.message, '[HF PATCH]') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d imagens ]; then git add -A imagens; fi
          git add -A dados/biblioteca-imagens.json
          if [ -d staging ]; then git add -A staging; fi
          if git diff --cached --quiet; then
            echo "No Home Finish/Kantai changes"
          else
            git commit -m "Build Home Finish and Kantai image library"
            git push
          fi

      - name: Build Wiler library
        if: ${{ !contains(github.event.head_commit.message, '[HF PATCH]') }}
        run: python scripts/build_wiler.py

      - name: Commit Wiler library
        if: ${{ !contains(github.event.head_commit.message, '[HF PATCH]') }}
        run: |
          if [ -d imagens/wiler ]; then git add -A imagens/wiler; fi
          git add -A dados/biblioteca-imagens.json
          if [ -d staging ]; then git add -A staging; fi
          if git diff --cached --quiet; then
            echo "No Wiler changes"
          else
            git commit -m "Build Wiler image library"
            git push
          fi
