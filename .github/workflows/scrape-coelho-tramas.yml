name: Scrape Coelho Tramas images

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  scrape:
    if: startsWith(github.event.issue.title, '[scrape-coelho-tramas]')
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Download Tramas images
        shell: bash
        run: |
          cat > /tmp/scrape.py <<'PY'
          import io, csv
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          BASE='https://www.coelhopapeisdeparede.com.br'
          OUT=Path('coelho-tramas')
          OUT.mkdir(exist_ok=True)
          HEAD={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'}

          def one(num):
              code=f'TR-{num}'
              purl=f'{BASE}/produtos/papel-de-parede-tramas-tr-{num}/'
              try:
                  r=requests.get(purl,headers=HEAD,timeout=15,allow_redirects=True)
                  r.raise_for_status()
                  if code.lower() not in r.text.lower():
                      return [code,purl,'','PAGE_NOT_FOUND']
                  soup=BeautifulSoup(r.text,'html.parser')
                  tag=soup.find('meta',attrs={'property':'og:image'}) or soup.find('meta',attrs={'name':'twitter:image'})
                  u=tag.get('content') if tag else None
                  if not u:
                      # fallback: first product image
                      img=soup.find('img',src=lambda x: x and 'products' in x)
                      u=img.get('src') if img else None
                  if not u:
                      return [code,purl,'','NO_IMAGE']
                  if u.startswith('//'): u='https:'+u
                  rr=requests.get(u,headers=HEAD,timeout=20,allow_redirects=True)
                  rr.raise_for_status()
                  im=Image.open(io.BytesIO(rr.content)); w,h=im.size
                  ext={'JPEG':'.jpg','PNG':'.png','WEBP':'.webp'}.get(im.format,'.jpg')
                  (OUT/f'{code}{ext}').write_bytes(rr.content)
                  return [code,purl,u,f'{w}x{h}']
              except Exception as e:
                  return [code,purl,'',f'FAIL:{e}']

          rows=[]
          with ThreadPoolExecutor(max_workers=20) as ex:
              futs=[ex.submit(one,n) for n in range(4001,4063)]
              for fut in as_completed(futs):
                  row=fut.result(); rows.append(row); print(*row)
          rows.sort(key=lambda r:r[0])
          ok=sum(1 for r in rows if r[3] and not r[3].startswith(('PAGE_','NO_','FAIL:')))
          with open(OUT/'manifest.csv','w',newline='',encoding='utf-8-sig') as f:
              wr=csv.writer(f); wr.writerow(['codigo','produto_url','imagem_url','dimensoes']); wr.writerows(rows)
          (OUT/'RESUMO.txt').write_text(f'baixadas={ok} tentadas=62\n',encoding='utf-8')
          print('DONE',ok)
          PY
          python /tmp/scrape.py
      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: coelho-tramas-images
          path: coelho-tramas/
          if-no-files-found: error
          retention-days: 2
